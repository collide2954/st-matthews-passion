# The large test orchestra of the engine tests (from Night Music for Orchestra).
#
# The sequence of the instruments in this file is the sequence in the score.
# Pitches are MIDI numbers of the real sound (60 = middle C).
# "transposition" is the number of semitones from the real sound up to the written note
# in the part of the player.
# "score_transposition" is the same number for the conductor score. The score is in C:
# only the instruments that play in a different octave are transposed there.
# If "score_transposition" is not given, it is 0.
# "score_clef" is the clef in the conductor score, if it is different from the part.
# The ranges are safe ranges for professional players.
# The identifiers fl3, ob3, cl3, and bn3 are the players of the piccolo, the English
# horn, the bass clarinet, and the contrabassoon: in this work they play only these
# instruments, and the score and the parts have these names.

[summary]
woodwind_players = 13
brass_players = 13
percussion_players = 7   # 1 timpani player and 6 percussion players
keyboard_and_plucked_players = 6
strings = [16, 14, 12, 10, 8]
minimum_strings = [14, 12, 10, 8, 6]
total_players = 99

